name: Refresh writing section

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC — off the hour to avoid GitHub's peak
  workflow_dispatch: # so it can be run by hand after publishing a post
  push:
    branches: [main]
    paths: [scripts/update-posts.mjs, .github/workflows/update-posts.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/update-posts.mjs

      - name: Commit if the feed moved
        run: |
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "README unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "profile: refresh writing section from feed"
          git push
